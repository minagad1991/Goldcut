<html lang="ar" dir="rtl"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Goldcut Factory System</title>
<style>
:root{
  --gold:#C9A84C;--gold2:#F0C040;
  --dark:#0F0F0F;--dark2:#161616;--dark3:#1E1E1E;--dark4:#262626;
  --red:#7B1E1E;--red2:#C0392B;--green:#1A6B3A;--green2:#27AE60;
  --phosphor:#CCFF00;--text:#F0EDE8;--text2:#888;--border:#2A2A2A;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Tajawal',sans-serif;background:var(--dark);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden;}

/* ── LOGIN ── */
#login-screen{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--dark);position:relative;}
#login-screen::before{content:'';position:absolute;width:600px;height:600px;background:radial-gradient(circle,rgba(201,168,76,.12) 0%,transparent 70%);top:50%;left:50%;transform:translate(-50%,-55%);pointer-events:none;}
.login-logo{font-size:64px;font-weight:900;letter-spacing:8px;color:var(--gold);text-shadow:0 0 60px rgba(201,168,76,.4);margin-bottom:6px;}
.login-sub{font-size:13px;color:var(--text2);letter-spacing:4px;text-transform:uppercase;margin-bottom:52px;}
.login-card{background:var(--dark2);border:1px solid var(--border);border-radius:16px;padding:40px 36px;width:380px;box-shadow:0 32px 80px rgba(0,0,0,.7);}
.login-field{margin-bottom:18px;}
.login-field label{display:block;font-size:11px;letter-spacing:2px;color:var(--text2);text-transform:uppercase;margin-bottom:8px;}
.login-field input{width:100%;background:var(--dark3);border:1px solid var(--border);border-radius:10px;padding:14px 18px;font-family:'Tajawal',sans-serif;font-size:16px;color:var(--text);outline:none;transition:border-color .2s;direction:ltr;text-align:center;}
.login-field input:focus{border-color:var(--gold);}
.login-btn{width:100%;background:linear-gradient(135deg,var(--gold),var(--gold2));border:none;border-radius:10px;padding:16px;font-family:'Tajawal',sans-serif;font-size:16px;font-weight:700;color:var(--dark);cursor:pointer;margin-top:8px;letter-spacing:1px;transition:opacity .2s;}
.login-btn:hover{opacity:.9;}
.login-error{color:var(--red2);font-size:13px;text-align:center;margin-top:12px;min-height:18px;}

/* ── APP LAYOUT ── */
#app{display:none;flex:1;flex-direction:column;overflow:hidden;}
.top-bar{background:var(--dark2);border-bottom:1px solid var(--border);padding:10px 20px;display:flex;align-items:center;gap:12px;flex-shrink:0;}
.app-logo{font-size:22px;font-weight:900;color:var(--gold);letter-spacing:4px;margin-left:auto;}
.top-select{background:var(--dark3);border:1px solid var(--border);border-radius:8px;padding:8px 14px;font-family:'Tajawal',sans-serif;font-size:14px;color:var(--text);outline:none;flex:1;max-width:380px;}
.top-btn{background:var(--dark3);border:1px solid var(--border);border-radius:8px;padding:8px 14px;font-family:'Tajawal',sans-serif;font-size:13px;color:var(--text2);cursor:pointer;white-space:nowrap;transition:border-color .2s;}
.top-btn:hover{border-color:var(--gold);color:var(--gold);}
.top-btn.gold{background:linear-gradient(135deg,var(--gold),var(--gold2));color:var(--dark);font-weight:700;border:none;}
#save-indicator{font-size:12px;color:var(--green2);opacity:0;transition:opacity .5s;white-space:nowrap;}

/* ── MAIN 3-COLUMN LAYOUT ── */
.workspace{flex:1;display:grid;grid-template-columns:1fr 1fr 340px;gap:0;overflow:hidden;}
.col{overflow-y:auto;padding:16px;border-left:1px solid var(--border);}
.col:last-child{border-left:none;}

/* Settings bar */
.settings-bar{display:flex;gap:8px;margin-bottom:14px;}
.setting-card{flex:1;background:var(--dark2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;text-align:center;}
.setting-label{font-size:10px;color:var(--text2);letter-spacing:1px;text-transform:uppercase;margin-bottom:6px;}
.setting-input{background:var(--dark3);border:1px solid var(--border);border-radius:7px;padding:6px 8px;width:100%;font-family:'Tajawal',sans-serif;font-size:14px;color:var(--gold);text-align:center;outline:none;font-weight:700;}
.setting-input:focus{border-color:var(--gold);}

/* Section */
.section{background:var(--dark2);border:1px solid var(--border);border-radius:12px;margin-bottom:12px;overflow:hidden;}
.sec-hdr{padding:10px 14px;display:flex;align-items:center;gap:8px;cursor:pointer;}
.sec-hdr.meats{background:linear-gradient(135deg,#2A0808,#150404);}
.sec-hdr.spices{background:linear-gradient(135deg,#081525,#040C15);}
.sec-hdr.fixed{background:linear-gradient(135deg,#150A02,#0A0501);}
.sec-title{font-size:13px;font-weight:700;flex:1;}
.sec-total{font-size:12px;color:var(--gold);font-weight:700;}
.chevron{font-size:10px;color:var(--text2);transition:transform .3s;}
.chevron.open{transform:rotate(180deg);}

table{width:100%;border-collapse:collapse;font-size:12px;}
th{background:var(--dark3);padding:8px 10px;text-align:center;color:var(--text2);font-size:10px;letter-spacing:1px;font-weight:500;white-space:nowrap;}
td{padding:7px 10px;text-align:center;border-bottom:1px solid var(--border);white-space:nowrap;}
tr:last-child td{border-bottom:none;}
tr.used{background:rgba(204,255,0,.1);}
tr.used td:first-child{color:var(--phosphor);font-weight:700;}
tr.tot-row td{background:var(--dark3);font-weight:700;color:var(--gold);font-size:12px;border-top:1px solid var(--border);}
.qty-input{background:var(--dark4);border:1px solid var(--border);border-radius:5px;padding:4px 6px;width:72px;font-family:'Tajawal',sans-serif;font-size:12px;color:var(--text);text-align:center;outline:none;}
.qty-input:focus{border-color:var(--gold);}
tr.used .qty-input{border-color:rgba(204,255,0,.4);background:rgba(204,255,0,.06);}

/* Summary */
.summary-card{background:var(--dark2);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:12px;}
.sum-hdr{background:linear-gradient(135deg,#0D2B15,#060F08);border-bottom:1px solid #1A4020;padding:12px 14px;font-size:13px;font-weight:700;color:var(--green2);}
.sum-row{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--border);font-size:13px;}
.sum-row:last-child{border-bottom:none;}
.sum-row.hl{background:rgba(39,174,96,.08);}
.sum-row.waste{background:rgba(192,57,43,.08);}
.sum-row.net-wt{background:rgba(39,174,96,.15);}
.sum-row.final{background:linear-gradient(135deg,#0D2B15,#060F08);padding:14px;}
.sum-row.final-kg{background:rgba(20,90,50,.2);}
.sum-lbl{color:var(--text2);font-size:12px;}
.sum-val{font-weight:700;}
.sum-row.hl .sum-val{color:var(--green2);}
.sum-row.waste .sum-val{color:var(--red2);}
.sum-row.net-wt .sum-val{color:var(--phosphor);}
.sum-row.final .sum-lbl{color:var(--gold);font-size:13px;font-weight:700;}
.sum-row.final .sum-val{color:var(--gold2);font-size:18px;}
.sum-row.final-kg .sum-val{color:var(--gold);font-size:15px;font-weight:700;}
.sum-row.nitrite .sum-val{color:var(--phosphor);font-size:12px;}
.actual-wt-input{background:var(--dark3);border:1px solid var(--gold);border-radius:7px;padding:6px 10px;width:120px;font-family:'Tajawal',sans-serif;font-size:13px;color:var(--gold);text-align:center;outline:none;}

.save-btn{width:100%;background:linear-gradient(135deg,var(--gold),var(--gold2));border:none;border-radius:10px;padding:12px;font-family:'Tajawal',sans-serif;font-size:14px;font-weight:700;color:var(--dark);cursor:pointer;margin-top:10px;letter-spacing:1px;transition:opacity .2s;}
.save-btn:hover{opacity:.9;}

/* History */
#history-col{display:none;}
.hist-entry{background:var(--dark3);border:1px solid var(--border);border-radius:10px;margin-bottom:10px;overflow:hidden;}
.hist-hdr{background:linear-gradient(135deg,#1A0808,#0A0404);padding:10px 12px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);}
.hist-product{font-size:13px;font-weight:700;color:var(--gold);}
.hist-date{font-size:10px;color:var(--text2);margin-top:2px;}
.hist-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:10px 12px;font-size:11px;}
.hist-btns{display:flex;gap:6px;padding:0 12px 10px;}
.hist-btn{flex:1;border:none;border-radius:7px;padding:6px;font-family:'Tajawal',sans-serif;font-size:12px;cursor:pointer;}
.hist-btn.load{background:var(--green);color:#fff;}
.hist-btn.del{background:var(--red);color:#fff;}
.hist-details{padding:0 12px 10px;font-size:11px;display:none;}

.col-header{font-size:13px;font-weight:700;color:var(--text2);letter-spacing:2px;text-transform:uppercase;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--border);}
.hist-filter{background:var(--dark3);border:1px solid var(--border);border-radius:8px;padding:7px 12px;font-family:'Tajawal',sans-serif;font-size:13px;color:var(--text);outline:none;width:100%;margin-bottom:12px;}
.empty-state{text-align:center;color:var(--text2);padding:40px 20px;font-size:13px;}

.stab{background:var(--dark3);border:1px solid var(--border);border-radius:8px;padding:7px 14px;font-family:Tajawal,sans-serif;font-size:13px;color:var(--text2);cursor:pointer;}
.stab.active{background:var(--gold);color:#000;font-weight:700;border-color:var(--gold);}

</style>
  <!-- Firebase SDK -->
  
  
</head>
<body>

<!-- LOGIN -->
<!-- Tabs -->
    <div style="display:flex;gap:8px;margin-bottom:20px;border-bottom:1px solid var(--border);padding-bottom:12px">
      <button id="stab-prices" class="stab active" onclick="switchSettingsTab('prices')">💰 أسعار الخامات</button>
      <button id="stab-meats" class="stab" onclick="switchSettingsTab('meats')">🥩 اللحوم</button>
      <button id="stab-spices" class="stab" onclick="switchSettingsTab('spices')">🧂 البهارات</button>
      <button id="stab-products" class="stab" onclick="switchSettingsTab('products')">📦 المنتجات</button>
    </div>

    <!-- أسعار الخامات -->
    <div id="spanel-prices">
      <div style="font-size:12px;color:var(--text2);margin-bottom:12px">الأسعار دي هتظهر تلقائياً في الخلطات</div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px" id="prices-grid"></div>
      <button onclick="saveAllPrices()" style="background:var(--gold);border:none;border-radius:8px;padding:10px 20px;font-family:Tajawal,sans-serif;font-size:14px;font-weight:700;color:#000;cursor:pointer">💾 حفظ الأسعار</button>
    </div>

    <!-- اللحوم -->
    <div id="spanel-meats" style="display:none">
      <div style="display:flex;gap:8px;margin-bottom:12px">
        <input type="text" id="new-meat-name" placeholder="اسم اللحمة الجديدة" style="flex:1;background:var(--dark3);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-family:Tajawal,sans-serif;font-size:13px;color:var(--text);outline:none">
        <button onclick="addMeat()" style="background:var(--green);border:none;border-radius:8px;padding:8px 16px;font-family:Tajawal,sans-serif;font-size:13px;color:#fff;cursor:pointer">➕ إضافة</button>
      </div>
      <div id="meats-settings-list" style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px"></div>
    </div>

    <!-- البهارات -->
    <div id="spanel-spices" style="display:none">
      <div style="display:flex;gap:8px;margin-bottom:12px">
        <input type="text" id="new-spice-name" placeholder="اسم البهار/الإضافة الجديدة" style="flex:1;background:var(--dark3);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-family:Tajawal,sans-serif;font-size:13px;color:var(--text);outline:none">
        <button onclick="addSpice()" style="background:var(--green);border:none;border-radius:8px;padding:8px 16px;font-family:Tajawal,sans-serif;font-size:13px;color:#fff;cursor:pointer">➕ إضافة</button>
      </div>
      <div id="spices-settings-list" style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px"></div>
    </div>

    <!-- المنتجات -->
    <div id="spanel-products" style="display:none">
      <div style="display:flex;gap:8px;margin-bottom:12px">
        <input type="text" id="new-product-key" placeholder="كود المنتج (بالإنجليزي)" style="width:150px;background:var(--dark3);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-family:Tajawal,sans-serif;font-size:13px;color:var(--text);outline:none">
        <input type="text" id="new-product-name" placeholder="اسم المنتج بالعربي" style="flex:1;background:var(--dark3);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-family:Tajawal,sans-serif;font-size:13px;color:var(--text);outline:none">
        <button onclick="addProduct()" style="background:var(--green);border:none;border-radius:8px;padding:8px 16px;font-family:Tajawal,sans-serif;font-size:13px;color:#fff;cursor:pointer">➕ إضافة</button>
      </div>
      <div id="products-settings-list"></div>
    </div>
  </div>
</div>

<script>

// ════════════════════════════════════════════
// SETTINGS
// ════════════════════════════════════════════


function renderProductsSettings(){
  var el = document.getElementById('products-settings-list');
  if(!el) return;
  el.innerHTML = '';
  var table = document.createElement('table');
  table.style.cssText = 'width:100%;border-collapse:collapse';
  table.innerHTML = '<thead><tr><th style="text-align:right;padding:6px;font-size:11px;color:var(--text2);border-bottom:1px solid var(--border)">الكود</th><th style="text-align:right;padding:6px;font-size:11px;color:var(--text2);border-bottom:1px solid var(--border)">الاسم</th><th style="border-bottom:1px solid var(--border)"></th></tr></thead>';
  var tbody = document.createElement('tbody');
  Object.entries(FACTORY_PRODUCTS).forEach(function(e){
    var tr = document.createElement('tr');
    var td1 = document.createElement('td'); td1.style.cssText='padding:7px 6px;font-size:12px;color:var(--text2)'; td1.textContent=e[0];
    var td2 = document.createElement('td'); td2.style.padding='7px 6px';
    var inp = document.createElement('input'); inp.type='text'; inp.value=e[1]; inp.dataset.key=e[0];
    inp.style.cssText='background:var(--dark3);border:1px solid var(--border);border-radius:6px;padding:5px 10px;font-family:Tajawal,sans-serif;font-size:13px;color:var(--text);outline:none;width:100%';
    td2.appendChild(inp);
    var td3 = document.createElement('td'); td3.style.cssText='padding:7px 6px;display:flex;gap:6px';
    var saveBtn = document.createElement('button');
    saveBtn.style.cssText='background:var(--green);border:none;border-radius:6px;padding:4px 10px;color:#fff;cursor:pointer;font-size:11px';
    saveBtn.textContent='💾';
    (function(key){ saveBtn.onclick=function(){ saveProductName(key); }; })(e[0]);
    var delBtn = document.createElement('button');
    delBtn.style.cssText='background:var(--red2);border:none;border-radius:6px;padding:4px 8px;color:#fff;cursor:pointer;font-size:11px';
    delBtn.textContent='🗑';
    (function(key){ delBtn.onclick=function(){ removeProduct(key); }; })(e[0]);
    td3.appendChild(saveBtn); td3.appendChild(delBtn);
    tr.appendChild(td1); tr.appendChild(td2); tr.appendChild(td3);
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  el.appendChild(table);
}

function showSettings(){
  loadSavedPrices();
  renderPricesGrid();
  renderMeatsSettings();
  renderSpicesSettings();
  renderProductsSettings();
  document.getElementById('settings-modal').style.display='block';
}

function closeSettings(){ document.getElementById('settings-modal').style.display='none'; }

function switchSettingsTab(tab){
  ['prices','meats','spices','products'].forEach(function(t){
    document.getElementById('spanel-'+t).style.display = t===tab?'':'none';
    document.getElementById('stab-'+t).classList.toggle('active', t===tab);
  });
}

// ── أسعار الخامات ────────────────────────────
function renderPricesGrid(){
  var grid = document.getElementById('prices-grid');
  if(!grid) return;
  var allItems = ALL_MEATS.concat(ALL_SPICES);
  grid.innerHTML = allItems.map(function(name){
    return '<div style="background:var(--dark3);border-radius:8px;padding:8px 10px">'+
      '<div style="font-size:11px;color:var(--text2);margin-bottom:4px">'+name+'</div>'+
      '<input type="number" min="0" step="0.5" value="'+getPrice(name)+'" data-item="'+name.replace(/"/g,"&quot;")+'"'+
      ' style="width:100%;background:var(--dark4);border:1px solid var(--border);border-radius:6px;padding:5px 8px;font-family:Tajawal,sans-serif;font-size:14px;color:var(--gold);font-weight:700;outline:none">'+
    '</div>';
  }).join('');
}

function saveAllPrices(){
  var inputs = document.querySelectorAll('#prices-grid input[data-item]');
  var newPrices = {};
  inputs.forEach(function(inp){
    var val = parseFloat(inp.value);
    if(val >= 0) newPrices[inp.dataset.item] = val;
  });
  Object.assign(PRICES, newPrices);
  savePrices(PRICES);
  // حدّث الـ display في الخلطات
  renderTable();
  if(window._cloudReady && window.saveFactoryToCloud) window.saveFactoryToCloud();
  showToast('✅ تم حفظ الأسعار');
}

// ── اللحوم ────────────────────────────────────
function renderMeatsSettings(){
  var el = document.getElementById('meats-settings-list');
  if(!el) return;
  el.innerHTML = ALL_MEATS.map(function(name, i){
    return '<div style="display:flex;align-items:center;gap:6px;background:var(--dark3);border-radius:8px;padding:7px 10px">'+
      '<span style="flex:1;font-size:12px">'+name+'</span>'+
      '<button onclick="removeMeat('+i+')" style="background:var(--red2);border:none;border-radius:6px;padding:3px 8px;color:#fff;cursor:pointer;font-size:11px">🗑</button>'+
    '</div>';
  }).join('');
}

function addMeat(){
  var inp = document.getElementById('new-meat-name');
  var name = inp.value.trim();
  if(!name){ alert('ادخل اسم اللحمة'); return; }
  if(ALL_MEATS.indexOf(name) > -1){ alert('موجود بالفعل'); return; }
  ALL_MEATS.push(name);
  PRICES[name] = 0;
  saveFactorySettings();
  inp.value = '';
  renderMeatsSettings();
  renderTable();
  showToast('✅ '+name+' اتضاف');
}

function removeMeat(i){
  if(!confirm('مسح: '+ALL_MEATS[i]+'?')) return;
  ALL_MEATS.splice(i, 1);
  saveFactorySettings();
  renderMeatsSettings();
  renderTable();
}

// ── البهارات ──────────────────────────────────
function renderSpicesSettings(){
  var el = document.getElementById('spices-settings-list');
  if(!el) return;
  el.innerHTML = ALL_SPICES.map(function(name, i){
    return '<div style="display:flex;align-items:center;gap:6px;background:var(--dark3);border-radius:8px;padding:7px 10px">'+
      '<span style="flex:1;font-size:12px">'+name+'</span>'+
      '<button onclick="removeSpice('+i+')" style="background:var(--red2);border:none;border-radius:6px;padding:3px 8px;color:#fff;cursor:pointer;font-size:11px">🗑</button>'+
    '</div>';
  }).join('');
}

function addSpice(){
  var inp = document.getElementById('new-spice-name');
  var name = inp.value.trim();
  if(!name){ alert('ادخل اسم البهار'); return; }
  if(ALL_SPICES.indexOf(name) > -1){ alert('موجود بالفعل'); return; }
  ALL_SPICES.push(name);
  PRICES[name] = 0;
  saveFactorySettings();
  inp.value = '';
  renderSpicesSettings();
  renderTable();
  showToast('✅ '+name+' اتضاف');
}

function removeSpice(i){
  if(!confirm('مسح: '+ALL_SPICES[i]+'?')) return;
  ALL_SPICES.splice(i, 1);
  saveFactorySettings();
  renderSpicesSettings();
  renderTable();
}

// ── المنتجات ──────────────────────────────────
var FACTORY_PRODUCTS = {};
(function(){
  // استخرج المنتجات الحالية من الـ select
  var sel = document.querySelector('select[onchange*="loadHistory"]');
  if(sel){
    Array.from(sel.options).forEach(function(opt){
      if(opt.value && opt.value !== '') FACTORY_PRODUCTS[opt.value] = opt.textContent;
    });
  }
})();



function saveProductName(key){
  var inp = document.querySelector('#products-settings-list input[data-key="'+key+'"]');
  if(!inp) return;
  FACTORY_PRODUCTS[key] = inp.value;
  updateProductSelect();
  saveFactorySettings();
  showToast('✅ تم حفظ الاسم');
}

function addProduct(){
  var key = document.getElementById('new-product-key').value.trim().replace(/\s+/g,'_');
  var name = document.getElementById('new-product-name').value.trim();
  if(!key||!name){ alert('ادخل الكود والاسم'); return; }
  if(FACTORY_PRODUCTS[key]){ alert('الكود موجود'); return; }
  FACTORY_PRODUCTS[key] = name;
  document.getElementById('new-product-key').value='';
  document.getElementById('new-product-name').value='';
  updateProductSelect();
  renderProductsSettings();
  saveFactorySettings();
  showToast('✅ منتج اتضاف');
}

function removeProduct(key){
  if(!confirm('مسح: '+FACTORY_PRODUCTS[key]+'?')) return;
  delete FACTORY_PRODUCTS[key];
  updateProductSelect();
  renderProductsSettings();
  saveFactorySettings();
}

function updateProductSelect(){
  var sels = document.querySelectorAll('select[onchange*="loadHistory"]');
  sels.forEach(function(sel){
    var val = sel.value;
    sel.innerHTML = '<option value="">كل المنتجات</option>'+
      Object.entries(FACTORY_PRODUCTS).map(function(e){
        return '<option value="'+e[0]+'">'+e[1]+'</option>';
      }).join('');
    sel.value = val;
  });
}

// ── حفظ إعدادات المصنع ───────────────────────
function saveFactorySettings(){
  try{
    localStorage.setItem('gc_factory_settings', JSON.stringify({
      meats: ALL_MEATS,
      spices: ALL_SPICES,
      products: FACTORY_PRODUCTS,
      prices: PRICES
    }));
  }catch(e){}
}

function loadFactorySettings(){
  try{
    var s = localStorage.getItem('gc_factory_settings');
    if(!s) return;
    var d = JSON.parse(s);
    if(d.meats && d.meats.length){ ALL_MEATS.length=0; d.meats.forEach(function(m){ALL_MEATS.push(m);}); }
    if(d.spices && d.spices.length){ ALL_SPICES.length=0; d.spices.forEach(function(m){ALL_SPICES.push(m);}); }
    if(d.products) Object.assign(FACTORY_PRODUCTS, d.products);
    if(d.prices) Object.assign(PRICES, d.prices);
  }catch(e){}}


function showToast(msg){
  var t=document.getElementById('factory-toast');
  if(!t){t=document.createElement('div');t.id='factory-toast';t.style.cssText='position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1A6B3A;color:#fff;padding:10px 24px;border-radius:8px;font-family:Tajawal,sans-serif;font-size:14px;font-weight:700;z-index:9999;opacity:0;transition:opacity .3s;pointer-events:none';document.body.appendChild(t);}
  t.textContent=msg;t.style.opacity='1';
  clearTimeout(t._x);t._x=setTimeout(function(){t.style.opacity='0';},2500);
}

// شغّل عند التحميل
window.addEventListener('load', function(){
  loadFactorySettings();
  loadSavedPrices();
  updateProductSelect();
});

</script>
